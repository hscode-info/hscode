name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'

jobs:
  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  spec-drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run spec
      - run: git diff --exit-code

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run pytest
      - run: uv build

  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4']
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test -c Release
      - run: dotnet pack src/Hscode.Sdk -c Release -o out

  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [11, 21]
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: sheets
      - run: npm test
        working-directory: excel
      - run: npm ci && npm run build && npm test
        working-directory: n8n
      - run: npm ci && npm test
        working-directory: zapier
      - name: Make app JSON parses
        run: for f in $(find make -name '*.json'); do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
