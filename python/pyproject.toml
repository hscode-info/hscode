[project]
name = "hscode"
version = "0.0.1"
description = "EU customs tariff (TARIC) SDK for hscode.info: classify products into CN codes and read import duties. Coming soon."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["hs code", "taric", "customs", "tariff", "cn code", "import duty"]

[project.urls]
Homepage = "https://hscode.info/en/developers"
Pricing = "https://hscode.info/en/pricing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hscode"]
